<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for a new account — SecureAuth authentication system.">
  <title>Register — SecureAuth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

  <main id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo__icon" aria-hidden="true">🔐</span>
        <h1 class="logo__text">Secure<span class="logo__accent">Auth</span></h1>
      </div>
      <p class="header__subtitle">Secure authentication system</p>
    </header>

    <!-- Register card -->
    <section class="card" aria-label="Registration form">
      <div class="card__header">
        <span class="card__badge">NEW ACCOUNT</span>
        <h2 class="card__title">Create your account</h2>
        <p class="card__desc">Fill in the details below to get started</p>
      </div>

      <!-- Alert -->
      <div class="alert" id="formAlert" hidden role="alert" aria-live="polite"></div>

      <form id="registerForm" class="auth-form" novalidate autocomplete="off">
        <!-- Email -->
        <div class="field">
          <label for="emailInput" class="field__label">Email Address</label>
          <div class="field__wrap">
            <input type="email" id="emailInput" class="field__input" placeholder="you@example.com" required>
          </div>
          <span class="field__hint" id="emailHint"></span>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="passwordInput" class="field__label">Password</label>
          <div class="field__wrap">
            <input type="password" id="passwordInput" class="field__input" placeholder="Min 8 characters, 1 number" required>
            <button type="button" class="field__toggle" id="pwToggle" aria-label="Show password"></button>
          </div>
          <div class="pw-strength" id="pwStrength" aria-hidden="true">
            <span class="pw-strength__bar"></span>
            <span class="pw-strength__bar"></span>
            <span class="pw-strength__bar"></span>
            <span class="pw-strength__bar"></span>
          </div>
          <span class="field__hint" id="passwordHint"></span>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label for="confirmInput" class="field__label">Confirm Password</label>
          <div class="field__wrap">
            <input type="password" id="confirmInput" class="field__input" placeholder="Re-enter your password" required>
            <button type="button" class="field__toggle" id="cfToggle" aria-label="Show password"></button>
          </div>
          <span class="field__hint" id="confirmHint"></span>
        </div>

        <button type="submit" class="btn btn--primary" id="registerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <span>Create Account</span>
        </button>
      </form>
    </section>

    <p class="link-bar">Already have an account? <a href="login.html">Sign in</a></p>
  </main>

  <script src="auth.js"></script>
  <script>
    (() => {
      'use strict';
      // Redirect if already logged in
      Auth.requireGuest();

      // Setup toggles & strength meter
      Auth.setupPasswordToggle('passwordInput', 'pwToggle');
      Auth.setupPasswordToggle('confirmInput', 'cfToggle');
      Auth.setupStrengthMeter('passwordInput', 'pwStrength');

      const form     = document.getElementById('registerForm');
      const email    = document.getElementById('emailInput');
      const password = document.getElementById('passwordInput');
      const confirm  = document.getElementById('confirmInput');

      // Live validation on blur
      email.addEventListener('blur', () => {
        if (!email.value.trim()) return;
        if (!Auth.validateEmail(email.value.trim())) {
          Auth.setFieldState('emailInput', 'error', 'emailHint', 'Enter a valid email address');
        } else {
          Auth.setFieldState('emailInput', 'success', 'emailHint', '');
        }
      });

      password.addEventListener('blur', () => {
        if (!password.value) return;
        const errors = Auth.validatePassword(password.value);
        if (errors.length) {
          Auth.setFieldState('passwordInput', 'error', 'passwordHint', errors.join('. '));
        } else {
          Auth.setFieldState('passwordInput', 'success', 'passwordHint', 'Password meets requirements');
        }
      });

      confirm.addEventListener('blur', () => {
        if (!confirm.value) return;
        if (confirm.value !== password.value) {
          Auth.setFieldState('confirmInput', 'error', 'confirmHint', 'Passwords do not match');
        } else {
          Auth.setFieldState('confirmInput', 'success', 'confirmHint', 'Passwords match');
        }
      });

      // Clear error on input
      [email, password, confirm].forEach(el => {
        el.addEventListener('input', () => {
          Auth.hideAlert('formAlert');
          el.classList.remove('is-invalid');
        });
      });

      // Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        Auth.hideAlert('formAlert');

        const emailVal    = email.value.trim();
        const passwordVal = password.value;
        const confirmVal  = confirm.value;

        // Basic empty check
        if (!emailVal || !passwordVal || !confirmVal) {
          Auth.showAlert('formAlert', 'Please fill in all fields.', 'error');
          return;
        }

        // Confirm match
        if (passwordVal !== confirmVal) {
          Auth.showAlert('formAlert', 'Passwords do not match.', 'error');
          Auth.setFieldState('confirmInput', 'error', 'confirmHint', 'Passwords do not match');
          return;
        }

        const result = await Auth.register(emailVal, passwordVal);

        if (result.ok) {
          Auth.showAlert('formAlert', result.msg, 'success');
          form.reset();
          // Reset field states
          ['emailInput', 'passwordInput', 'confirmInput'].forEach(id => Auth.setFieldState(id, '', '', ''));
          // Reset strength bars
          document.querySelectorAll('.pw-strength__bar').forEach(b => b.className = 'pw-strength__bar');
          // Redirect after brief delay
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          Auth.showAlert('formAlert', result.msg, 'error');
        }
      });
    })();
  </script>
</body>
</html>
