<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek to-do list app — add, edit, complete, and delete tasks with localStorage persistence.">
  <title>TaskFlow — Smart To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient background -->
  <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--2" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--3" aria-hidden="true"></div>

  <main id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo__icon" aria-hidden="true">✦</span>
        <h1 class="logo__text">Task<span class="logo__accent">Flow</span></h1>
      </div>
      <p class="header__subtitle">Organise your day, one task at a time</p>
    </header>

    <!-- Add Task -->
    <section class="card card--add" aria-label="Add a new task">
      <form id="addForm" class="add-form" autocomplete="off">
        <div class="add-form__field-wrap">
          <input
            type="text"
            id="taskInput"
            class="add-form__input"
            placeholder="What needs to be done?"
            maxlength="200"
            aria-label="Task description"
          >
          <span class="add-form__char-count" id="charCount" aria-hidden="true">0 / 200</span>
        </div>
        <button type="submit" class="btn btn--add" id="addBtn">
          <svg class="btn__svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Add Task</span>
        </button>
      </form>
    </section>

    <!-- Stats ribbon -->
    <div class="stats-ribbon" id="statsRibbon">
      <div class="stat">
        <span class="stat__count" id="pendingCount">0</span>
        <span class="stat__label">Pending</span>
      </div>
      <div class="stat__divider" aria-hidden="true"></div>
      <div class="stat">
        <span class="stat__count stat__count--green" id="completedCount">0</span>
        <span class="stat__label">Completed</span>
      </div>
      <button class="btn btn--clear" id="clearCompletedBtn" title="Clear all completed tasks" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        <span>Clear Done</span>
      </button>
    </div>

    <!-- Pending Tasks -->
    <section class="card card--list" aria-label="Pending tasks">
      <div class="card__header">
        <span class="card__badge">PENDING</span>
      </div>
      <ul class="task-list" id="pendingList" aria-live="polite"></ul>
      <div class="empty-state" id="pendingEmpty">
        <span class="empty-state__icon" aria-hidden="true">🎯</span>
        <p class="empty-state__text">No pending tasks — add one above to get started!</p>
      </div>
    </section>

    <!-- Completed Tasks -->
    <section class="card card--list" aria-label="Completed tasks">
      <div class="card__header">
        <span class="card__badge card__badge--green">COMPLETED</span>
      </div>
      <ul class="task-list task-list--done" id="completedList" aria-live="polite"></ul>
      <div class="empty-state" id="completedEmpty">
        <span class="empty-state__icon" aria-hidden="true">☕</span>
        <p class="empty-state__text">No completed tasks yet — keep going!</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
